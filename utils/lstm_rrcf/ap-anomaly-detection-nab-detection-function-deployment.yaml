apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: controlplane.ap-anomaly-detection-nab-detection-mock-func
    app.kubernetes.io/name: ap-anomaly-detection-nab-detection-mock-func
    app.kubernetes.io/version: 0.0.1
  name: ap-anomaly-detection-nab-detection-mock-func-deployment
  namespace: controlplane
spec:
  progressDeadlineSeconds: 10
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: controlplane.ap-anomaly-detection-nab-detection-mock-func
      app.kubernetes.io/managed-by: controlplane-operator
      app.kubernetes.io/name: ap-anomaly-detection-nab-detection-mock-func
      app.kubernetes.io/version: 0.0.1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: controlplane.ap-anomaly-detection-nab-detection-mock-func
        app.kubernetes.io/managed-by: controlplane-operator
        app.kubernetes.io/name: ap-anomaly-detection-nab-detection-mock-func
        app.kubernetes.io/version: 0.0.1
    spec:
      containers:
      - env:
        - name: AP_ANOMALY_DETECTION_FUNCTION_CONFIG
          value: /opt/IBM/configs/function-config.yaml
        - name: FISSION_ENV_CONFIG
          value: /opt/IBM/configs/fission-environment-config.yaml
        - name: FILE_PATH
          value: /userfunc
        - name: FUNCTION_NAME
          value: nab_detection.main
        image: nab-detection-fission:latest
        imagePullPolicy: Never
        name: ap-anomaly-detection-nab-detection-mock-func
        command:
        - python
        - /app/server.py
        ports:
        - containerPort: 8888
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 512m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/ssl/redis/write/ca.crt
          name: redis-write-tls-ca-volume
          readOnly: true
          subPath: ca.crt
        - mountPath: /etc/ssl/redis/read/ca.crt
          name: redis-read-tls-ca-volume
          readOnly: true
          subPath: ca.crt
        - mountPath: /etc/ssl/opensearch/ca.crt
          name: opensearch-tls-ca-volume
          readOnly: true
          subPath: ca.crt
        - mountPath: /etc/ssl/kafka/internal
          name: kafka-internal-tls-volume
          readOnly: true
        - mountPath: /opt/IBM/configs/
          name: substituted-config-volume
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - bin/sh
        - -c
        - |
          envsubst < /tmp/function-config/config.yaml > /opt/IBM/configs/function-config.yaml &&
          envsubst < /tmp/fission-environment-config-volume/config.yaml > /opt/IBM/configs/fission-environment-config.yaml &&
          sed -i 's/log_level: error/log_level: info/g' /opt/IBM/configs/function-config.yaml
        env:
        - name: REDIS_WRITE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis.password
              name: redis-secret
        - name: REDIS_READ_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis.password
              name: redis-secret
        - name: REDIS_WRITE_TLS_CA_PATH
          value: /etc/ssl/redis/write/ca.crt
        - name: REDIS_READ_TLS_CA_PATH
          value: /etc/ssl/redis/read/ca.crt
        - name: OPENSEARCH_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: opensearch-admin-credentials-secret
        - name: OPENSEARCH_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: opensearch-admin-credentials-secret
        - name: OPENSEARCH_TLS_CA_PATH
          value: /etc/ssl/opensearch/ca.crt
        - name: KAFKA_INTERNAL_TLS_USER_KEY_PATH
          value: /etc/ssl/kafka/internal/user.key
        - name: KAFKA_INTERNAL_TLS_USER_CERTIFICATE_PATH
          value: /etc/ssl/kafka/internal/user.crt
        - name: KAFKA_INTERNAL_TLS_CA_PATH
          value: /etc/ssl/kafka/internal/ca.crt
        image: icr.io/z-operations-unite-snapshot/base_utilities:main-latest
        imagePullPolicy: Always
        name: envsubst
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp//function-config/config.yaml
          name: function-config-volume
          subPath: config.yaml
        - mountPath: /tmp//fission-environment-config-volume/config.yaml
          name: fission-environment-config-volume
          subPath: config.yaml
        - mountPath: /opt/IBM/configs/
          name: substituted-config-volume
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: ap-func-service-account
      serviceAccountName: ap-func-service-account
      terminationGracePeriodSeconds: 30
      volumes:
      - name: redis-write-tls-ca-volume
        secret:
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
          secretName: redis-tls-cert-secret
      - name: redis-read-tls-ca-volume
        secret:
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
          secretName: redis-tls-cert-secret
      - name: opensearch-tls-ca-volume
        secret:
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
          secretName: opensearch-cluster-http-cert
      - name: kafka-internal-tls-volume
        projected:
          defaultMode: 420
          sources:
          - secret:
              items:
              - key: user.key
                path: user.key
              name: kafka-ap-function-user
          - secret:
              items:
              - key: user.crt
                path: user.crt
              name: kafka-ap-function-user
          - secret:
              items:
              - key: ca.crt
                path: ca.crt
              name: kafka-cluster-cluster-ca-cert
      - configMap:
          defaultMode: 420
          name: ap-anomaly-detection-function-config
        name: function-config-volume
      - emptyDir: {}
        name: substituted-config-volume
      - configMap:
          defaultMode: 420
          name: fission-environment-config
        name: fission-environment-config-volume