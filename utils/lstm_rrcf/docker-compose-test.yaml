version: '3.8'
services:
  python-app:
    image: nab-demo:latest
    command: sh -c "cd /app/libs/nab_detection_pkg && pytest -v -s ./tests"
    volumes:
      - ../../utils/lstm_rrcf/dev_tool/:/app/utils/lstm_rrcf/dev_tool
      - ../../libs:/app/libs
    environment:
      - NAB_DETECTION_CONFIG=/app/libs/nab_detection_pkg/aiops_nab_detection/sample-config-test.yaml
      - AP_ANOMALY_DETECTION_FUNCTION_CONFIG=/app/libs/nab_detection_pkg/aiops_nab_detection/sample-config-dev.yaml
      - ENABLE_RDEBUG=true
      - SAVE_RESULT_LOCAL=true
      - LOCAL_RESULT_FILE=/app/libs/fake_data_generator_pkg/fake_data_generator/results-test.csv
      - LOCAL_RESULT_KAFKA_FILE=/app/libs/fake_data_generator_pkg/fake_data_generator/results_kafka-test.log