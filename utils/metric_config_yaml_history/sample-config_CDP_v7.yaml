training:
    date_range:
        from: 30 days
        to: now
    global_training_exclusion:
      - from: 2025-02-20T00:00
        to: 2025-02-21T00:12
      - from: "15:00:00"
        to: "16:00:00"
    # 15 minutes
    interval: 15
    # rolling window size
    rolling_window_size: 5
    k_raw: 6
    pre_training_outlier_lower_quantile: 0.01
    pre_training_outlier_upper_quantile: 0.99

change_detection:
    date_range:
        from: 1h
        to: now

lead_function:
    num_threads: 5

training_lead_function:
    num_threads: 5
