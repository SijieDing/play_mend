# Change Activities:
#  v0 - include the initial list of all ODP and CDP KPIs.


# value of DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level: debug
plot: false

opensearch:
  - host: 9.114.195.47
    port: 9200
    protocol: http
    # user: admin
    # password: admin
    # tls:
    #   ca: ./configs/ca.crt

kafka:
  - broker: 9.114.195.47
    port: 9092
    # mtls:
    #   enabled: true
    #   server:
    #     ca: /path/to/ca.crt
    #   client:
    #     key: /path/to/tls.key
    #     cert: /path/to/tls.crt

opensearch_indexes:
  read: unite-metrics
  # for write
  baseline: unite-baselines-metrics

kafka_topics:
  anomalies: zou.events.00.raw

