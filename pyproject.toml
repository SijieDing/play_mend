[project]
dependencies = [
    "aiops_unite==0.1",
    "pandas==2.3.2",
    "pandas-stubs==2.2.2.240514",
    "matplotlib==3.9.0"
]


[tool.black]
line-length = 120
target-version = ['py38']

[tool.pylint."messages control"]
disable = "all"
enable = [
  "empty-docstring",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring"
]
ignore = ["setup.py", "__init__.py"]
ignore-paths = ['.*/tests', ]

[tool.isort]
profile = "black"
line_length = 120
auto_identify_namespace_packages = false
force_single_line = true # pyright doesn't like implicit namespace + single line (related to https://github.com/microsoft/pyright/issues/2882?)

[tool.pyright]
extraPaths=["../../libs"]
reportMissingTypeArgument = true  # Report generic classes used without type arguments
strictListInference = true  # Use union types when inferring types of lists elements, instead of Any
